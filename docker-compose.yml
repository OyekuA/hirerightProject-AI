services:
  fastapi:
    image: ghcr.io/oyekua/hirerightproject-ai:latest
    env_file: .env
    depends_on: [qdrant]
    restart: unless-stopped
    volumes:
      - ingest_status_data:/data/ingest_status
      - interview_session_data:/data/interview_sessions
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 2048m
        reservations:
          cpus: '0.4'
          memory: 768m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.17.0
    restart: unless-stopped
    environment:
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=4
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 3072m
        reservations:
          cpus: '0.3'
          memory: 1024m

  nginx:
    image: docker.io/library/nginx:1.29.7-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [fastapi]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128m
        reservations:
          cpus: '0.05'
          memory: 64m

volumes:
  qdrant_data:
  ingest_status_data:
  interview_session_data: