services:
  fastapi:
    build: .
    env_file: .env
    depends_on: [qdrant]
    restart: unless-stopped
    volumes:
      - ingest_status_data:/data/ingest_status
    ports: 
      - "8000:8000"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1024m
        reservations:
          cpus: '0.5'
          memory: 384m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant
    restart: unless-stopped
    environment:
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=2
    ports: ["6333:6333"]
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 1280m
        reservations:
          cpus: '0.3'
          memory: 512m

  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [fastapi]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128m
        reservations:
          cpus: '0.05'
          memory: 64m

volumes:
  qdrant_data:
  ingest_status_data: